<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>배지 모아 챗 설정</title>
    <link
      rel="preload"
      href="fonts/S-CoreDream-4Regular.woff"
      as="font"
      type="font/woff"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/S-CoreDream-6Bold.woff"
      as="font"
      type="font/woff"
      crossorigin
    />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-root">
      <header class="popup-head">
        <div class="popup-head-main">
          <h1>배지 모아 챗 설정</h1>
          <p id="scope-info" class="scope-info">채널: 확인 중...</p>
        </div>
        <button
          id="update-banner-toggle"
          type="button"
          class="update-banner-toggle"
          aria-label="업데이트 배너 끄기"
          aria-pressed="true"
          data-tooltip="업데이트 배너 끄기"
          data-tooltip-align="end"
          data-tooltip-nowrap="true"
        >
          <span class="update-banner-icon is-enabled" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M10.3 21a2 2 0 0 0 3.4 0" />
              <path d="M4 17h16" />
              <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9" />
            </svg>
          </span>
          <span class="update-banner-icon is-disabled" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M13.7 21a2 2 0 0 1-3.4 0" />
              <path d="M18.6 8A6 6 0 0 0 8.2 4" />
              <path d="M6.3 6.3A6 6 0 0 0 6 8c0 7-3 7-3 9h14" />
              <path d="m2 2 20 20" />
            </svg>
          </span>
        </button>
        <div id="theme-toggle" class="theme-toggle" data-expanded="false">
          <button
            id="theme-toggle-current"
            type="button"
            class="theme-toggle-current"
            aria-label="팝업 테마 변경"
            aria-haspopup="true"
            aria-expanded="false"
          >
            <span
              class="theme-icon"
              data-theme-icon="system"
              aria-hidden="true"
            >
              <svg
                viewBox="0 0 24 24"
                width="18"
                height="18"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="3" y="4" width="18" height="13" rx="2" />
                <path d="M8 20h8M12 17v3" />
              </svg>
            </span>
            <span class="theme-icon" data-theme-icon="light" aria-hidden="true">
              <svg
                viewBox="0 0 24 24"
                width="18"
                height="18"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="4" />
                <path
                  d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
                />
              </svg>
            </span>
            <span class="theme-icon" data-theme-icon="dark" aria-hidden="true">
              <svg
                viewBox="0 0 24 24"
                width="18"
                height="18"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
              </svg>
            </span>
          </button>
          <div
            class="theme-toggle-segment"
            role="radiogroup"
            aria-label="팝업 테마 선택"
          >
            <button
              type="button"
              class="theme-toggle-option"
              data-theme-value="light"
              role="radio"
              aria-checked="false"
              data-tooltip="라이트"
              data-tooltip-align="end"
              data-tooltip-nowrap="true"
            >
              <svg
                viewBox="0 0 24 24"
                width="18"
                height="18"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle cx="12" cy="12" r="4" />
                <path
                  d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
                />
              </svg>
            </button>
            <button
              type="button"
              class="theme-toggle-option"
              data-theme-value="dark"
              role="radio"
              aria-checked="false"
              data-tooltip="다크"
              data-tooltip-align="end"
              data-tooltip-nowrap="true"
            >
              <svg
                viewBox="0 0 24 24"
                width="18"
                height="18"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
              </svg>
            </button>
            <button
              type="button"
              class="theme-toggle-option"
              data-theme-value="system"
              role="radio"
              aria-checked="false"
              data-tooltip="시스템"
              data-tooltip-align="end"
              data-tooltip-nowrap="true"
            >
              <svg
                viewBox="0 0 24 24"
                width="18"
                height="18"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <rect x="3" y="4" width="18" height="13" rx="2" />
                <path d="M8 20h8M12 17v3" />
              </svg>
            </button>
          </div>
        </div>
      </header>

      <div
        class="settings-tabs"
        id="settings-tabs"
        role="tablist"
        aria-label="설정 분류"
      >
        <button
          type="button"
          class="settings-tab is-active"
          data-tab="display"
          role="tab"
          aria-selected="true"
          aria-controls="tab-panel-display"
          id="tab-btn-display"
        >
          표시 설정
        </button>
        <button
          type="button"
          class="settings-tab"
          data-tab="targets"
          role="tab"
          tabindex="-1"
          aria-selected="false"
          aria-controls="tab-panel-targets"
          id="tab-btn-targets"
        >
          대상 추가 및 제외
        </button>
        <button
          type="button"
          class="settings-tab"
          data-tab="capture"
          role="tab"
          tabindex="-1"
          aria-selected="false"
          aria-controls="tab-panel-capture"
          id="tab-btn-capture"
        >
          캡처
        </button>
        <button
          type="button"
          class="settings-tab"
          data-tab="data"
          role="tab"
          tabindex="-1"
          aria-selected="false"
          aria-controls="tab-panel-data"
          id="tab-btn-data"
        >
          데이터 관리
        </button>
      </div>

      <div
        class="settings-tab-panel is-active"
        id="tab-panel-display"
        role="tabpanel"
        aria-labelledby="tab-btn-display"
      >
        <section class="section">
          <h2>크기 및 배치</h2>
          <div class="field-grid-2col">
            <label class="field-row">
              <span>팝업 폰트 크기</span>
              <select id="popup-font-scale">
                <option value="0.8">작게 (80%)</option>
                <option value="0.9">조금 작게 (90%)</option>
                <option value="1" selected>기본 (100%)</option>
                <option value="1.1">조금 크게 (110%)</option>
                <option value="1.2">크게 (120%)</option>
              </select>
            </label>
            <label class="field-row">
              <span>채팅 폰트 크기</span>
              <select id="chat-font-scale">
                <option value="0.8">작게 (80%)</option>
                <option value="0.9">조금 작게 (90%)</option>
                <option value="1" selected>기본 (100%)</option>
                <option value="1.1">조금 크게 (110%)</option>
                <option value="1.2">크게 (120%)</option>
                <option value="1.5">더 크게 (150%)</option>
                <option value="1.75">매우 크게 (175%)</option>
                <option value="2">최대 (200%)</option>
              </select>
            </label>
          </div>
          <div class="toggle-grid-2col">
            <label class="toggle-row">
              <input type="checkbox" id="enable-chat-width-resize" />
              <span>채팅창 넓이 조절</span>
            </label>
            <label class="toggle-row">
              <input type="checkbox" id="place-chat-on-left" />
              <span>채팅창 왼쪽 배치</span>
            </label>
          </div>
        </section>

        <section class="section">
          <h2>모아보기 팝업</h2>
          <div class="toggle-grid-2col">
            <label class="toggle-row">
              <input type="checkbox" id="hide-popup-bg" />
              <span>배경색 제거</span>
            </label>
            <label class="toggle-row">
              <input type="checkbox" id="hide-popup-border" />
              <span>테두리 선 제거</span>
            </label>
            <label class="toggle-row">
              <input type="checkbox" id="hide-popup-time" />
              <span>시간 숨김</span>
            </label>
            <label class="toggle-row">
              <input type="checkbox" id="show-popup-role-badges-only" />
              <span>역할 배지만 표시</span>
            </label>
            <label
              class="toggle-row"
              data-tooltip="일반 모아보기 팝업 헤더에도 글자 크기 조절 버튼을 표시합니다."
            >
              <input type="checkbox" id="show-popup-font-scale-control" />
              <span>폰트 크기 조절 버튼 표시</span>
            </label>
            <label
              class="toggle-row"
              data-tooltip="실제 채팅창에 표시된 특수 채팅만 원본 스타일로 모아봅니다. 다른 탭을 보고 있거나 채팅 행이 표시되지 않으면 기본 스타일을 사용합니다."
            >
              <input type="checkbox" id="use-original-special-chat-style" />
              <span>특수 채팅 원본 스타일 우선</span>
            </label>
            <label class="toggle-row">
              <input type="checkbox" id="keep-popup-open" />
              <span>항상 펼침</span>
            </label>
            <label class="toggle-row">
              <input type="checkbox" id="delete-without-confirm" />
              <span>필터 확인 없이 바로 삭제</span>
            </label>
          </div>
          <div class="field-grid-2col popup-timestamp-options">
            <label class="field-row">
              <span>팝업 시간 형식</span>
              <select id="popup-timestamp-format">
                <option value="24h" selected>24시간</option>
                <option value="12h-en">AM/PM</option>
                <option value="12h-ko">오전/오후</option>
              </select>
            </label>
            <label
              class="field-row"
              data-tooltip="테마 대비색은 라이트 모드에서 검정, 다크 모드에서 흰색으로 표시합니다. 색상 배경의 특수 채팅 시간은 가독성을 위해 흰색을 유지합니다."
            >
              <span>팝업 시간 색상</span>
              <select id="popup-timestamp-color-mode">
                <option value="default" selected>기존 색상</option>
                <option value="contrast">테마 대비색</option>
              </select>
            </label>
          </div>
          <label class="field-row">
            <span>전용 창 사용 중 원래 탭</span>
            <select id="detached-origin-view">
              <option value="hide" selected>숨김</option>
              <option value="pill">알림 버튼만 유지</option>
              <option value="keep">그대로 유지</option>
            </select>
          </label>
        </section>

        <section class="section">
          <h2>채팅창 표시</h2>
          <div class="toggle-grid-2col">
            <label class="toggle-row">
              <input type="checkbox" id="hide-chat-bg" />
              <span>배경색 제거</span>
            </label>
            <label class="toggle-row">
              <input type="checkbox" id="hide-chat-border" />
              <span>테두리 선 제거</span>
            </label>
            <label
              class="toggle-row"
              data-tooltip="블라인드/클린봇으로 가려진 채팅을 원문으로 표시합니다."
            >
              <input type="checkbox" id="restore-blinded-chat" />
              <span>가려진 채팅 표시</span>
            </label>
            <label
              class="toggle-row"
              data-tooltip="각 채팅 앞에 보낸 시각을 선택한 형식으로 표시합니다."
            >
              <input type="checkbox" id="show-chat-timestamp" />
              <span>채팅 시간 표시</span>
            </label>
            <label
              class="toggle-row"
              data-tooltip="새 배지 채팅이 도착하면 상단 알림 버튼 주위가 잠시 반짝입니다. 끄면 버튼 내용과 읽지 않은 채팅 수만 갱신됩니다."
            >
              <input type="checkbox" id="pill-glow-enabled" />
              <span>새 채팅 반짝임 사용</span>
            </label>
            <label
              class="toggle-row"
              data-tooltip="닉네임 대신 정적인 채팅 아이콘과 읽지 않은 채팅 수만 표시합니다."
            >
              <input type="checkbox" id="compact-pill" />
              <span>알림 버튼 간단히 표시</span>
            </label>
            <label
              class="toggle-row"
              data-tooltip="상태와 관계없이 상단 알림 버튼을 항상 숨깁니다. 모아보기 팝업을 열 수 없게 됩니다."
            >
              <input type="checkbox" id="hide-pill-button" />
              <span>배지 알림 버튼 숨김</span>
            </label>
            <label
              class="toggle-row"
              data-tooltip="읽지 않은 배지 채팅이 없을 때만 상단 알림 버튼을 숨기고, 새 채팅이 도착하면 다시 표시합니다."
            >
              <input type="checkbox" id="hide-empty-pill" />
              <span>새 채팅 없을 때 버튼 숨김</span>
            </label>
          </div>
          <div class="field-grid-2col chat-timestamp-options">
            <label class="field-row">
              <span>시간 표시 형식</span>
              <select id="chat-timestamp-format">
                <option value="24h" selected>24시간</option>
                <option value="12h-en">AM/PM</option>
                <option value="12h-ko">오전/오후</option>
              </select>
            </label>
            <label
              class="field-row"
              data-tooltip="테마 대비색은 라이트 모드에서 검정, 다크 모드에서 흰색으로 표시합니다."
            >
              <span>시간 글자 색상</span>
              <select id="chat-timestamp-color-mode">
                <option value="default" selected>기존 색상</option>
                <option value="contrast">테마 대비색</option>
              </select>
            </label>
          </div>
        </section>

        <section class="section">
          <h2>채팅창 요소 숨김</h2>
          <div class="toggle-grid-2col">
            <label class="toggle-row">
              <input type="checkbox" id="hide-chat-ranking" />
              <span>랭킹</span>
            </label>
            <label class="toggle-row">
              <input type="checkbox" id="hide-chat-donation" />
              <span>후원 메시지</span>
            </label>
            <label class="toggle-row">
              <input type="checkbox" id="hide-chat-mission" />
              <span>진행 중인 미션</span>
            </label>
            <label class="toggle-row">
              <input type="checkbox" id="hide-chat-subscription" />
              <span>구독 메시지</span>
            </label>
            <label class="toggle-row">
              <input type="checkbox" id="hide-chat-prediction" />
              <span>승부예측</span>
            </label>
            <label class="toggle-row">
              <input type="checkbox" id="hide-chat-mission-message" />
              <span>미션 메시지</span>
            </label>
          </div>
        </section>
      </div>

      <div
        class="settings-tab-panel"
        id="tab-panel-targets"
        role="tabpanel"
        aria-labelledby="tab-btn-targets"
        hidden
      >
        <section class="section" id="hidden-section">
          <div class="section-head">
            <h2>
              닉네임별 표시 관리
              <span id="hidden-count-info" class="section-count">(0/0)</span>
            </h2>
            <div class="section-actions">
              <button id="hidden-select-all" type="button">전체 숨김</button>
              <button id="hidden-clear-all" type="button">숨김 해제</button>
            </div>
          </div>
          <p class="section-description">
            닉네임을 누르면 채팅창 알림을 숨기고, 체크박스로 모아보기 제외
            대상을 선택합니다.
          </p>
          <div class="hidden-exclude-toolbar">
            <div
              id="hidden-exclude-scope-tabs"
              class="scope-segmented"
              role="group"
              aria-label="모아보기 제외 적용 범위"
            >
              <button type="button" data-scope="channel" aria-pressed="true">
                현재 채널
              </button>
              <button type="button" data-scope="global" aria-pressed="false">
                모든 방문 채널
              </button>
            </div>
            <button
              id="hidden-exclude-selected"
              type="button"
              class="collapse-toggle-btn"
              data-tooltip="선택한 닉네임을 팝업창 모아보기에서 제외"
            >
              모아보기 제외
            </button>
          </div>
          <div class="advanced-row hidden-prune-row">
            <label
              class="toggle-row hidden-auto-prune-toggle"
              data-tooltip="탭/채널 재연결 시 채팅 내역이 없고 숨김·제외·추가 대상이 아닌 닉네임을 자동으로 목록에서 정리"
            >
              <input type="checkbox" id="hidden-auto-prune-toggle" />
              <span>미활동 닉네임 자동 정리</span>
            </label>
            <button
              id="hidden-prune-empty"
              type="button"
              class="collapse-toggle-btn"
              data-tooltip="채팅 내역이 없고 숨김·제외·추가 대상이 아닌 닉네임을 목록에서 제거"
            >
              미활동 닉네임 정리
            </button>
          </div>
          <div id="hidden-chips" class="chip-wrap"></div>
        </section>

        <section class="section">
          <div class="section-head">
            <h2>
              모아보기 대상 추가
              <span id="tracked-count-info" class="section-count">(0/200)</span>
            </h2>
            <div class="section-actions">
              <button id="tracked-collapse-toggle" type="button">펼치기</button>
              <button id="tracked-delete-selected" type="button">
                선택 삭제
              </button>
              <button id="tracked-delete-all" type="button">전체 삭제</button>
            </div>
          </div>
          <div
            id="tracked-scope-tabs"
            class="scope-segmented"
            role="group"
            aria-label="모아보기 대상 적용 범위"
          >
            <button type="button" data-scope="channel" aria-pressed="true">
              현재 채널
            </button>
            <button type="button" data-scope="global" aria-pressed="false">
              모든 방문 채널
            </button>
          </div>
          <div id="tracked-add-row" class="add-row">
            <input
              id="tracked-input"
              type="text"
              placeholder="닉네임 입력 (스트리머만 추가 가능)"
              data-tooltip="'익명의 후원자', '미션 결과'는 예외적으로 추가 가능"
            />
            <button id="add-nickname" type="button">닉네임 추가</button>
          </div>
          <div id="tracked-chips" class="chip-wrap"></div>
        </section>
      </div>

      <div
        class="settings-tab-panel"
        id="tab-panel-capture"
        role="tabpanel"
        aria-labelledby="tab-btn-capture"
        hidden
      >
        <section class="section">
          <h2>캡처</h2>
          <div class="toggle-grid-2col">
            <label
              class="toggle-row"
              data-tooltip="모아보기 팝업 헤더에 채팅 캡처 선택 버튼을 표시합니다."
            >
              <input type="checkbox" id="show-capture-button" />
              <span>캡처 버튼 표시</span>
            </label>
            <label
              class="toggle-row"
              data-tooltip="선택 모드에서 채팅을 드래그하여 연속 선택하거나 선택 해제합니다."
            >
              <input type="checkbox" id="enable-capture-drag-selection" />
              <span>드래그 선택 사용</span>
            </label>
            <label
              class="toggle-row"
              data-tooltip="PNG 파일을 저장하기 전에 생성된 이미지를 확인합니다. 여러 파일로 나뉘면 이전·다음 버튼으로 확인할 수 있습니다."
            >
              <input type="checkbox" id="show-capture-preview" />
              <span>저장 전 미리보기</span>
            </label>
          </div>
        </section>
      </div>

      <div
        class="settings-tab-panel"
        id="tab-panel-data"
        role="tabpanel"
        aria-labelledby="tab-btn-data"
        hidden
      >
        <section class="section">
          <h2>세션 캐시</h2>
          <label class="toggle-row toggle-row-with-action">
            <input type="checkbox" id="enable-session-cache" />
            <span>채널 채팅 유지 (브라우저 종료 시 삭제)</span>
            <button
              type="button"
              id="clear-current-channel-session"
              class="inline-action-btn"
            >
              현재 채널 채팅 비우기
            </button>
          </label>
        </section>

        <section class="section">
          <h2>데이터 관리</h2>
          <p class="section-description">
            현재 설정만 옮기거나 저장된 사용자 데이터를 함께 백업합니다.
          </p>
          <div class="data-management-grid">
            <button type="button" id="export-settings">설정 내보내기</button>
            <button type="button" id="import-settings">설정 가져오기</button>
            <button type="button" id="export-full-backup">전체 백업</button>
            <button type="button" id="import-full-backup" class="is-restore">
              전체 복원
            </button>
          </div>
          <input
            type="file"
            id="data-import-file"
            accept=".json,application/json"
            hidden
          />
        </section>
      </div>

      <section
        id="exclude-confirm-modal"
        class="popup-confirm-modal"
        aria-hidden="true"
        inert
      >
        <button
          type="button"
          id="exclude-confirm-backdrop"
          class="popup-confirm-backdrop"
          aria-label="모달 닫기"
        ></button>
        <div
          id="exclude-confirm-dialog"
          class="popup-confirm-dialog"
          role="dialog"
          aria-modal="true"
          tabindex="-1"
        >
          <h3 id="exclude-confirm-title" class="popup-confirm-title">
            모아보기 제외 적용
          </h3>
          <p id="exclude-confirm-message" class="popup-confirm-message">
            모아보기 제외한 닉네임의 기존 모아둔 채팅도 함께 삭제할까요?
          </p>
          <div class="popup-confirm-actions">
            <button type="button" id="exclude-confirm-cancel">취소</button>
            <button type="button" id="exclude-confirm-keep">
              기존 채팅 유지
            </button>
            <button type="button" id="exclude-confirm-prune" class="is-danger">
              기존 채팅 삭제
            </button>
          </div>
        </div>
      </section>

      <section
        id="generic-confirm-modal"
        class="popup-confirm-modal"
        aria-hidden="true"
        inert
      >
        <button
          type="button"
          id="generic-confirm-backdrop"
          class="popup-confirm-backdrop"
          aria-label="모달 닫기"
        ></button>
        <div
          id="generic-confirm-dialog"
          class="popup-confirm-dialog"
          role="dialog"
          aria-modal="true"
          tabindex="-1"
        >
          <h3 id="generic-confirm-title" class="popup-confirm-title"></h3>
          <p id="generic-confirm-message" class="popup-confirm-message"></p>
          <div class="popup-confirm-actions">
            <button type="button" id="generic-confirm-cancel">취소</button>
            <button type="button" id="generic-confirm-ok" class="is-danger">
              확인
            </button>
          </div>
        </div>
      </section>

      <p id="status" class="status"></p>
    </main>

    <div
      id="settings-tooltip"
      class="settings-tooltip"
      role="tooltip"
      hidden
    ></div>

    <script src="popup.js"></script>
  </body>
</html>
